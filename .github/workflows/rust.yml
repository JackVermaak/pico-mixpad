name: windows app

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-rs
    steps:
      - uses: actions/checkout@v4
      - run: cargo test

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host-rs
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pico-mixpad-windows
          path: host-rs/target/release/pico-mixpad.exe
