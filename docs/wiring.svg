<text x="694" y="618" text-anchor="end" font-size="11" fill="#ecfdf5">GP16 21</text>
<line x1="712" y1="614" x2="870" y2="614" stroke="#7c3aed" stroke-width="3"/>
<text x="878" y="619" font-size="14" fill="#7c3aed" font-weight="600">App knob 3 · push</text>
<line x1="40" y1="680" x2="1100" y2="680" stroke="#e5e7eb"/>
<text x="60" y="710" font-size="15" fill="#111827" font-weight="bold" text-anchor="start">Key switch</text>
<text x="60" y="732" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">GPIO ── switch ── GND</text>
<text x="60" y="752" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">(pressed = low)</text>
<text x="330" y="710" font-size="15" fill="#111827" font-weight="bold" text-anchor="start">EC11 encoder</text>
<text x="330" y="732" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">3-pin side: A · common · B  →  GPIO n, GND, GPIO n+1</text>
<text x="330" y="752" font-size="13" fill="#111827" font-weight="normal" text-anchor="start">2-pin side: push  →  GPIO n+2 and GND</text>
<text x="330" y="772" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">A and B must be neighbouring GPIO (PIO decoder)</text>
<text x="760" y="710" font-size="15" fill="#111827" font-weight="bold" text-anchor="start">Mic LEDs on one pin</text>
<text x="760" y="732" font-size="13" fill="#65a30d" font-weight="normal" text-anchor="start">GP28 → 680 Ω → red LED → GND</text>
<text x="760" y="752" font-size="13" fill="#65a30d" font-weight="normal" text-anchor="start">3V3 → 560 Ω → green LED → GP28</text>
<text x="760" y="772" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">high = red · low = green · input = off</text>
<text x="60" y="800" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="start">OLED: wire by the labels on the module (VCC/GND order varies). Power from 3V3, never VBUS.</text>
</svg>