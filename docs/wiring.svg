<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 830" width="1140" height="830" font-family="Helvetica, Arial, sans-serif">
<rect width="1140" height="830" fill="#ffffff"/>
<text x="570" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">Pico Mixpad v1 wiring</text>
<text x="570" y="66" text-anchor="middle" font-size="13" fill="#4b5563">Every key and encoder pin goes between its GPIO and GND (internal pull-ups, no diodes). Pico 2 shown from above, USB at the top.</text>
