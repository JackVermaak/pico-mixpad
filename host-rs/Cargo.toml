[package]
name = "pico-mixpad-host"
version = "2.0.0"
edition = "2021"
description = "Pico Mixpad host app: per-app volume, mic mute and the settings page, as one small Windows program"
license = "MIT"
authors = ["Jack Vermaak"]
publish = false

[[bin]]
name = "pico-mixpad"
path = "src/main.rs"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
tiny_http = "0.12"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1"
