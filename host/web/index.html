<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico Mixpad Settings</title>
<style>
:root {
  --bg: #f4f3f0; --panel: #ffffff; --panel-2: #f8f7f4; --line: #e2e0da; --line-2: #cfccc4;
  --ink: #17171a; --ink-2: #5a5853; --ink-3: #8b8881;
  --accent: #6250d6; --accent-ink: #ffffff; --accent-soft: #ecebfb;
  --case: #2c2d31; --case-edge: #1d1e21; --plate: #36373c; --cap: #f1efe9; --cap-ink: #26262a;
  --cap-sel: #c9c2ff; --knob: #1b1c1f; --knob-ring: #4a4b51;
  --ok: #138a4a; --ok-soft: #e3f4ea; --warn: #a15c00; --warn-soft: #fbefdc; --bad: #c0362c;
  --oled-bg: #04070a; --oled-yellow: #ffd23f; --oled-blue: #4fc0ff;
  --radius: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141416; --panel: #1d1d20; --panel-2: #232327; --line: #2e2e33; --line-2: #3d3d43;
    --ink: #f0efec; --ink-2: #b9b7b0; --ink-3: #85837d;
    --accent: #9085e9; --accent-ink: #141416; --accent-soft: #2a2740;
    --case: #2a2b30; --case-edge: #0e0e10; --plate: #34353b;
    --ok: #4cc47f; --ok-soft: #173224; --warn: #e2a443; --warn-soft: #36290f; --bad: #ef6b60;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .01em; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.pill.ok .dot { background: var(--ok); } .pill.warn .dot { background: var(--warn); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line-2); background: var(--panel); padding: 7px 14px; border-radius: 8px;
  cursor: pointer; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
main { display: grid; grid-template-columns: minmax(300px, 440px) minmax(320px, 1fr); gap: 20px;
  padding: 20px; max-width: 1180px; margin: 0 auto; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); }
.device-wrap { padding: 18px; position: sticky; top: 76px; align-self: start; }
@media (max-width: 820px) { .device-wrap { position: static; } }
.hint { color: var(--ink-3); font-size: 12.5px; margin: 10px 2px 0; }

/* ---- the pad, drawn to scale from the case design (110 x 135 mm) ---- */
.device { position: relative; width: 100%; aspect-ratio: 110 / 135; border-radius: 6% / 5%;
  background: linear-gradient(160deg, var(--plate), var(--case)); border: 2px solid var(--case-edge);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.25); container-type: inline-size; }
.part { position: absolute; transform: translate(-50%, -50%); cursor: pointer; outline: none; }
.part:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
.cap { width: 16.4%; aspect-ratio: 1; border-radius: 9%; background: var(--cap); color: var(--cap-ink);
  border: none; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 2px 0 rgba(0,0,0,.35);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px;
  font-size: clamp(8px, 2.6cqw, 11.5px); line-height: 1.15; text-align: center; overflow: hidden; }
.cap .num { position: absolute; top: 5%; left: 8%; font-size: .78em; opacity: .5; font-weight: 600; }
.cap .lab { font-weight: 600; word-break: break-word; max-height: 3.5em; overflow: hidden; }
.cap.sel { background: var(--cap-sel); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 0 0 3px var(--accent); }
.part.pick { box-shadow: 0 0 0 3px var(--warn) !important; }
.part.target { animation: pulse 1.1s ease-in-out infinite; }
.part.placed { opacity: .55; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 3px var(--accent); } 50% { box-shadow: 0 0 0 7px var(--accent); } }
.big-step { font-size: 18px; font-weight: 600; margin: 6px 0 4px; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 12px 0; }
.progress div { height: 100%; background: var(--accent); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.cap.none .lab { opacity: .45; }
.knob { width: 13.6%; aspect-ratio: 1; border-radius: 50%; border: none;
  background: radial-gradient(circle at 35% 30%, #3a3b40, var(--knob) 60%);
  box-shadow: 0 0 0 3px var(--knob-ring), 0 4px 8px rgba(0,0,0,.45); }
.knob::after { content: ""; position: absolute; left: 50%; top: 12%; width: 6%; height: 22%;
  background: #d9d7d0; border-radius: 2px; transform: translateX(-50%); }
.knob.master { width: 15.5%; }
.knob.sel { box-shadow: 0 0 0 3px var(--accent), 0 4px 8px rgba(0,0,0,.45); }
.klabel { position: absolute; transform: translate(-50%, 0); color: #e9e7e1; font-size: clamp(8px, 2.4cqw, 11px);
  font-weight: 600; letter-spacing: .02em; white-space: nowrap; pointer-events: none; text-shadow: 0 1px 1px #000; }
.oled { width: 22%; aspect-ratio: 2 / 1; border-radius: 3px; background: var(--oled-bg); border: none;
  padding: 0; box-shadow: 0 0 0 4px #111, 0 0 0 5px #3a3a3f; }
.oled canvas { width: 100%; height: 100%; display: block; border-radius: 2px; }
.big-oled { background: #111; padding: 10px; border-radius: 10px; max-width: 420px; margin-bottom: 6px; }
.big-oled canvas { width: 100%; display: block; border-radius: 3px; }
.oled.sel { box-shadow: 0 0 0 4px #111, 0 0 0 7px var(--accent); }
.led { width: 5%; aspect-ratio: 1; border-radius: 50%; border: none; background: #3b1212;
  box-shadow: 0 0 0 2px #111; }
.led.green { background: #123b1e; }
.led.on.red { background: #ff4d4d; box-shadow: 0 0 0 2px #111, 0 0 10px #ff4d4d; }
.led.on.green { background: #3dff7a; box-shadow: 0 0 0 2px #111, 0 0 10px #3dff7a; }
.led.sel { box-shadow: 0 0 0 2px #111, 0 0 0 5px var(--accent); }
.usb { position: absolute; left: -2px; top: 15%; width: 3%; height: 8%; background: #111; border-radius: 0 2px 2px 0; }

/* ---- editor ---- */
.editor { padding: 22px 24px 26px; }
.editor h2 { margin: 0; font-size: 20px; }
.sub { color: var(--ink-2); margin: 4px 0 18px; }
.section { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 18px; }
.section h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
label.f { display: block; margin: 14px 0 6px; font-weight: 600; }
.help { color: var(--ink-3); font-size: 12.5px; margin-top: 6px; }
input[type=text], select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2);
  background: var(--panel-2); }
input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input.invalid { border-color: var(--bad); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line-2); background: var(--panel-2); padding: 7px 12px; border-radius: 8px;
  cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > * { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border: 1px solid var(--line-2);
  border-radius: 8px; background: var(--panel-2); min-height: 42px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 4px 3px 10px; border-radius: 999px;
  background: var(--accent-soft); font-size: 13px; }
.chip button { border: none; background: transparent; cursor: pointer; padding: 0 6px; color: var(--ink-2); font-size: 15px; }
.chips input { flex: 1; min-width: 140px; border: none; background: transparent; padding: 4px; }
.chips input:focus { outline: none; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.suggest button { border: 1px dashed var(--line-2); background: transparent; border-radius: 999px; padding: 2px 10px;
  font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
.toggle { display: flex; align-items: center; gap: 10px; margin: 12px 0; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.mods { display: flex; gap: 6px; }
.mods button { min-width: 56px; }
.combo { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
.recording { outline: 2px dashed var(--accent); }
.note { border-radius: 8px; padding: 10px 12px; margin-top: 14px; font-size: 13px; background: var(--panel-2);
  border: 1px solid var(--line); color: var(--ink-2); }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.links { display: flex; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
.links a { color: var(--accent); cursor: pointer; text-decoration: none; font-size: 13px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; transition: .25s;
  max-width: min(560px, 92vw); z-index: 20; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.err { background: var(--bad); color: #fff; }
.dirty-flag { color: var(--warn); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>Pico Mixpad</h1>
  <span class="pill" id="pcPill"><span class="dot"></span><span id="pcText">PC app</span></span>
  <span class="pill" id="drivePill"><span class="dot"></span><span id="driveText">Pad drive</span></span>
  <span class="spacer"></span>
  <span class="dirty-flag" id="dirtyFlag" hidden>Unsaved changes</span>
  <button class="btn" id="revertBtn" disabled>Revert</button>
  <button class="btn primary" id="saveBtn" disabled>Save</button>
</header>

<main>
  <section class="card device-wrap">
    <div class="device" id="device" aria-label="Macropad layout"></div>
    <p class="hint">Click a key, knob, the screen or the LED to change it. Pressing a key on the pad also selects it.</p>
    <div class="links">
      <a id="arrLink" tabindex="0">Rearrange keys &amp; knobs</a>
      <a id="advLink" tabindex="0">Connection settings</a>
      <a id="dlLink" tabindex="0">Download settings.json</a>
    </div>
  </section>
  <section class="card editor" id="editor" aria-live="polite"></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let S = null;            // server state: {host, pad, status, padDrive, options, defaults, keyIds}
let host = null, pad = null;        // working copies being edited
let saved = "";          // JSON of the last saved/loaded host+pad, for change tracking
let sel = { kind: "key", i: 0 };
let recording = false;
let arrange = null;       // null, or {pick, guided: {step, placed, lastSeq}}
let lastSeq = null;       // last pad input seen (status.input.seq)
let liveSig = "";

const $ = (q, el = document) => el.querySelector(q);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
};
const clone = o => JSON.parse(JSON.stringify(o));

// Positions from case/mixpad_v1.scad: x from the centre, y from the front edge (mm).
const PITCH = 19.05;
const KEY_POS = [];
[37.05, 18].forEach(y => [-1.5, -0.5, 0.5, 1.5].forEach(i => KEY_POS.push([i * PITCH, y])));
const KNOB_POS = [[-34.5, 60], [-11.5, 60], [11.5, 60], [34.5, 60]];
const MASTER_POS = [34.5, 86], OLED_POS = [-22, 86.6], LED_POS = [[6, 86], [14, 86]];
const pos = ([x, y]) => ({ left: ((x + 55) / 110 * 100) + "%", top: ((135 - y) / 135 * 100) + "%" });

// ---------------------------------------------------------------------------
// Labels
// ---------------------------------------------------------------------------
let KEY_LABEL = {}, MEDIA_LABEL = {}, MOD_LABEL = {};
function indexOptions() {
  S.options.modifiers.forEach(m => MOD_LABEL[m.name] = m.label);
  S.options.keyGroups.forEach(g => g.keys.forEach(k => KEY_LABEL[k.name] = k.label));
  S.options.media.forEach(m => MEDIA_LABEL[m.name] = m.label);
  Object.assign(KEY_LABEL, { LEFT_CONTROL: "Ctrl", RIGHT_CONTROL: "Ctrl", LEFT_SHIFT: "Shift", RIGHT_SHIFT: "Shift",
    LEFT_ALT: "Alt", RIGHT_ALT: "Alt", LEFT_GUI: "Win", RIGHT_GUI: "Win", WINDOWS: "Win", COMMAND: "Win" });
}
const isMod = n => n in MOD_LABEL;
function comboText(keys) {
  return keys.map(k => MOD_LABEL[k] || KEY_LABEL[k] || k).join(" + ");
}
function baseName(target) {
  const t = (target || "").trim();
  if (!t) return "";
  if (/^[a-z]+:\/\//i.test(t)) { try { return new URL(t).hostname.replace(/^www\./, ""); } catch { return t; } }
  const last = t.split(/[\\/]/).filter(Boolean).pop() || t;
  return last.replace(/\.(exe|lnk|bat|cmd|url)$/i, "");
}
function actionLabel(a, keyId) {
  switch (a.type) {
    case "mic": return "Mic mute";
    case "media": return MEDIA_LABEL[a.code] || a.code;
    case "keys": return comboText(a.keys);
    case "text": return "“" + a.text + "”";
    case "pc": return host.pcActions[keyId] ? "Open " + baseName(host.pcActions[keyId]) : "Open… (not set)";
    default: return "Nothing";
  }
}

// ---------------------------------------------------------------------------
// Device drawing
// ---------------------------------------------------------------------------
function drawDevice() {
  const dev = $("#device");
  dev.replaceChildren(h("div", { class: "usb", title: "USB cable" }));
  // pad.layout maps each position on the pad to the key/knob wired there.
  pad.layout.keys.forEach((i, p) => {
    const a = pad.keys[i];
    const b = h("button", { class: "part cap" + (!arrange && sel.kind === "key" && sel.i === i ? " sel" : "")
        + (a.type === "none" ? " none" : "") + arrangeClass("keys", p),
      "aria-label": "Key " + (i + 1) + ": " + actionLabel(a, String(i + 1)),
      onclick: () => arrange ? arrangeClick("keys", p) : select("key", i) },
      h("span", { class: "num" }, String(i + 1)), h("span", { class: "lab" }, actionLabel(a, String(i + 1))));
    Object.assign(b.style, pos(KEY_POS[p]));
    dev.append(b);
  });
  pad.layout.knobs.forEach((i, p) => {
    const c = host.channels[i];
    const b = h("button", { class: "part knob" + (!arrange && sel.kind === "knob" && sel.i === i ? " sel" : "") + arrangeClass("knobs", p),
      "aria-label": "App knob " + (i + 1) + ": " + c.label,
      onclick: () => arrange ? arrangeClick("knobs", p) : select("knob", i) });
    Object.assign(b.style, pos(KNOB_POS[p]));
    const l = h("span", { class: "klabel" }, arrange ? `${i + 1} · ${c.label}` : c.label);
    Object.assign(l.style, pos([KNOB_POS[p][0], KNOB_POS[p][1] + 12.5]));
    dev.append(b, l);
  });
  const m = h("button", { class: "part knob master" + (sel.kind === "master" ? " sel" : ""),
    "aria-label": "Master volume knob", onclick: () => select("master") });
  Object.assign(m.style, pos(MASTER_POS));
  const ml = h("span", { class: "klabel" }, "Master");
  Object.assign(ml.style, pos([MASTER_POS[0], MASTER_POS[1] + 14]));
  const o = h("button", { class: "part oled" + (sel.kind === "screen" ? " sel" : ""), "aria-label": "Screen",
    onclick: () => select("screen") }, h("canvas", { class: "oledc", width: 256, height: 128 }));
  Object.assign(o.style, pos(OLED_POS));
  dev.append(m, ml, o);
  const mic = S.status.connected ? S.status.mic : null;
  ["red", "green"].forEach((c, i) => {
    const on = mic === true ? c === "red" : mic === false ? c === "green" : false;
    const b = h("button", { class: `part led ${c}` + (on ? " on" : "") + (sel.kind === "led" ? " sel" : ""),
      "aria-label": "Mic LED", onclick: () => select("led") });
    Object.assign(b.style, pos(LED_POS[i]));
    dev.append(b);
  });
  drawOled();
}

// Same text layout as the firmware (code.py: channel_row / screen_lines, mixpad_settings.row_positions).
function channelRow(name, volume, muted) {
  let bar, value;
  if (volume == null) { bar = "........"; value = "  --"; }
  else {
    const filled = Math.floor((volume * 8 + 50) / 100);
    bar = "#".repeat(filled) + ".".repeat(8 - filled);
    value = muted ? "MUTE" : String(volume).padStart(3) + "%";
  }
  return name.slice(0, 7).padEnd(7) + " " + bar + " " + value;
}
function rowPositions(screen) {
  let r = screen.mic_row;
  if (r === "auto") r = screen.rotation === 0 ? "top" : "bottom";
  return r === "top" ? [2, 16, 28, 40, 52] : [51, 0, 12, 24, 36];
}
function drawOled() {
  for (const cv of document.querySelectorAll("canvas.oledc")) paintOled(cv, cv.width / 128);
}
function paintOled(cv, k) {
  const ctx = cv.getContext("2d");
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = "#04070a"; ctx.fillRect(0, 0, 128, 64);
  const st = S.status, live = st.connected && st.levels && st.levels.length === 4;
  const sample = [{ volume: 72, muted: false }, { volume: 55, muted: false }, { volume: 40, muted: false }, { volume: null, muted: false }];
  const mic = live ? st.mic : false;
  const lines = [mic === true ? ">>> MIC MUTED <<<" : mic === false ? "MIC live" : "MIC: none found"];
  pad.layout.knobs.forEach(i => {        // rows follow the knobs left to right, like the firmware
    const lv = live ? st.levels[i] : sample[i];
    lines.push(channelRow(host.channels[i].label, lv.volume, lv.muted));
  });
  const ys = rowPositions(pad.screen);
  // Yellow/blue panels: the yellow strip is the panel's first 16 rows - at the top, or the bottom when rotated.
  const yellowTop = pad.screen.rotation === 0 ? 0 : 48;
  ctx.font = "10px ui-monospace, Consolas, 'DejaVu Sans Mono', monospace";
  ctx.textBaseline = "top";
  lines.forEach((t, r) => {
    for (let c = 0; c < t.length && c < 21; c++) {
      const y = ys[r] + 1;
      ctx.fillStyle = (y >= yellowTop && y < yellowTop + 16) ? "#ffd23f" : "#4fc0ff";
      ctx.fillText(t[c], c * 6 + 0.5, y);
    }
  });
}

// ---------------------------------------------------------------------------
// Editors
// ---------------------------------------------------------------------------
function select(kind, i = 0) { if (arrange) stopGuided(); arrange = null; sel = { kind, i }; recording = false; render(); }

function render() {
  drawDevice();
  const ed = $("#editor");
  const parts = ({
    key: () => keyEditor(sel.i), knob: () => knobEditor(sel.i), master: masterEditor,
    screen: screenEditor, led: ledEditor, adv: advEditor, arrange: arrangeEditor,
  }[arrange ? "arrange" : sel.kind])();
  ed.replaceChildren(...[parts].flat(Infinity).filter(x => x != null && x !== false));
  drawOled();
  updateDirty();
}

function seg(options, value, onpick) {
  return h("div", { class: "seg", role: "group" }, options.map(([v, label]) =>
    h("button", { type: "button", "aria-pressed": String(v === value), onclick: () => onpick(v) }, label)));
}
function toggle(text, checked, onchange, help) {
  return h("div", {},
    h("label", { class: "toggle" }, h("input", { type: "checkbox", checked, onchange: e => onchange(e.target.checked) }), text),
    help ? h("div", { class: "help" }, help) : null);
}

const ACTION_TYPES = [["mic", "Mic mute"], ["media", "Media"], ["keys", "Shortcut"], ["text", "Type text"], ["pc", "Open on PC"], ["none", "Nothing"]];

function actionEditor(action, keyId, set) {
  const wrap = h("div");
  const setType = t => {
    const fresh = { mic: { type: "mic" }, media: { type: "media", code: "PLAY_PAUSE" }, keys: { type: "keys", keys: ["F13"] },
      text: { type: "text", text: "" }, pc: { type: "pc" }, none: { type: "none" } }[t];
    set(t === action.type ? action : fresh);
  };
  wrap.append(h("label", { class: "f" }, "Action"), seg(ACTION_TYPES, action.type, setType));

  if (action.type === "mic") {
    wrap.append(h("div", { class: "note" }, "Toggles the Windows default microphone. The LED turns red when muted. Needs the PC app."));
  } else if (action.type === "media") {
    const s = h("select", { onchange: e => set({ type: "media", code: e.target.value }) },

// ---------------------------------------------------------------------------
// Change tracking, saving
// ---------------------------------------------------------------------------
const snapshot = () => JSON.stringify({ host, pad });
function updateDirty() {
  const dirty = snapshot() !== saved;
  $("#saveBtn").disabled = !dirty;
  $("#revertBtn").disabled = !dirty;
  $("#dirtyFlag").hidden = !dirty;
}
function refreshDeviceOnly() {
  const ed = document.activeElement;
  drawDevice();
  if (ed && ed.focus) ed.focus();
}
function toast(msg, err = false, ms = 4200) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast show" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast" + (err ? " err" : ""), ms);
}

async function save() {
  $("#saveBtn").disabled = true;
  try {
    const r = await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json", "X-Mixpad": "1" },
      body: JSON.stringify({ host, pad }) });
    const res = await r.json();
    if (!r.ok) { toast(res.error || "Couldn't save", true); updateDirty(); return; }
    pad = res.pad;
    saved = snapshot();
    S.padDrive = res.padDrive;
    render(); drawPills();
    if (res.padWritten) toast("Saved. The pad restarts to apply its settings (about 2 seconds).");
    else if (res.padError) toast("PC app settings saved, but " + res.padError, true, 7000);
    else toast("PC app settings saved. The pad's drive (CIRCUITPY) wasn't found, so its settings weren't. Plug it in and save again, or use “Download settings.json”.", true, 8000);
  } catch (e) {
    toast("Couldn't reach the PC app. Is it still running?", true);
    updateDirty();
  }
}

function download() {
  const blob = new Blob([JSON.stringify(pad, null, 2) + "\n"], { type: "application/json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: "settings.json" });
  document.body.append(a); a.click(); a.remove();
  toast("Copy settings.json to the CIRCUITPY drive; the pad restarts by itself.");
}

function drawPills() {
  const st = S.status;
  $("#pcPill").className = "pill " + (st.connected ? "ok" : "warn");
  $("#pcText").textContent = st.standalone ? "PC app not running (settings only)" :
    st.connected ? `Pad connected on ${st.port}${st.firmware ? " · firmware " + st.firmware : ""}` : "Pad not connected";
  $("#drivePill").className = "pill " + (S.padDrive ? "ok" : "warn");
  $("#driveText").textContent = S.padDrive ? "Pad drive " + S.padDrive : "Pad drive not found";
}

async function poll() {
  try {
    const r = await fetch("/api/status");
    const d = await r.json();
    const wasLive = S.status.connected;
    S.status = d.status; S.padDrive = d.padDrive;
    drawPills();
    const sig = JSON.stringify([d.status.connected, d.status.levels, d.status.mic]);
    if (sig !== liveSig) {
      liveSig = sig;
      if (!recording && document.activeElement?.tagName !== "INPUT") drawDevice(); else drawOled();
    }
    if (!wasLive && d.status.connected && sel.kind === "knob") render();
    const inp = d.status.input;
    if (inp && lastSeq !== null && inp.seq !== lastSeq) onPadInput(inp);
    if (inp) lastSeq = inp.seq; else if (lastSeq === null) lastSeq = 0;
  } catch { /* server gone: keep the page as it is */ }
  setTimeout(poll, arrange && arrange.guided ? 200 : 500);
}

// A key press or knob turn reported by the pad (firmware 1.3+).
function onPadInput(inp) {
  if (arrange && arrange.guided) return guidedInput(inp);
  if (arrange || recording || ["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
  if (inp.kind === "button") {
    if (inp.n < 8) select("key", inp.n);
    else if (inp.n < 12) select("knob", inp.n - 8);
    else select("master");
  } else if (inp.kind === "knob" && !(sel.kind === "knob" && sel.i === inp.n)) select("knob", inp.n);
}

// ---------------------------------------------------------------------------
// Rearranging keys and knobs to match the wiring
// ---------------------------------------------------------------------------
const STEPS = [...[0, 1, 2, 3, 4, 5, 6, 7].map(p => ["keys", p]), ...[0, 1, 2, 3].map(p => ["knobs", p])];
const fwOk = () => !S.status.firmware || parseFloat(S.status.firmware) >= 1.3;

function arrangeClass(name, p) {
  if (!arrange) return "";
  const g = arrange.guided;
  if (g) {
    const [n, tp] = STEPS[g.step] || [];
    if (n === name && tp === p) return " target";
    if (g.placed[name].includes(p)) return " placed";
    return "";
  }
  return arrange.pick && arrange.pick.name === name && arrange.pick.p === p ? " pick" : "";
}
function swap(name, p, q) {
  const arr = pad.layout[name];
  [arr[p], arr[q]] = [arr[q], arr[p]];
}
function arrangeClick(name, p) {
  if (arrange.guided) return;
  const pk = arrange.pick;
  if (pk && pk.name === name && pk.p !== p) { swap(name, pk.p, p); arrange.pick = null; }
  else arrange.pick = pk && pk.name === name && pk.p === p ? null : { name, p };
  render();
}
async function identify(on) {
  try {
    await fetch("/api/identify", { method: "POST", headers: { "Content-Type": "application/json", "X-Mixpad": "1" },
      body: JSON.stringify({ on }) });
  } catch { /* ignore */ }
}
function startGuided() {
  arrange = { pick: null, guided: { step: 0, placed: { keys: [], knobs: [] }, msg: "" } };
  identify(true);
  arrange.guided.timer = setInterval(() => identify(true), 30000);   // the pad switches it off after 60 s
  render();
}
function stopGuided() {
  if (arrange && arrange.guided) { clearInterval(arrange.guided.timer); identify(false); }
}
function guidedInput(inp) {
  const g = arrange.guided, [name, p] = STEPS[g.step];
  let n;
  if (name === "keys" && inp.kind === "button" && inp.n < 8) n = inp.n;
  else if (name === "knobs" && inp.kind === "knob") n = inp.n;
  else return;
  const arr = pad.layout[name], q = arr.indexOf(n);
  if (g.placed[name].includes(q)) { g.msg = `That one is already placed. Press the highlighted ${name === "keys" ? "key" : "knob"}.`; return render(); }
  swap(name, p, q);
  g.placed[name].push(p);
  g.msg = "";
  nextStep();
}
function nextStep() {
  const g = arrange.guided;
  g.step++;
  if (g.step >= STEPS.length) {
    stopGuided();
    arrange = { pick: null, done: true };
  }
  render();
}
function skipStep() {
  const [name, p] = STEPS[arrange.guided.step];
  arrange.guided.placed[name].push(p);
  nextStep();
}

function arrangeEditor() {
  const g = arrange.guided;
  const out = [h("h2", {}, "Rearrange keys & knobs"),
    h("p", { class: "sub" }, "Match the layout on the left to where each key and knob is wired on your pad. Their settings move with them.")];
  if (g) {
    const [name] = STEPS[g.step];
    const total = STEPS.length;
    out.push(h("div", { class: "progress" }, h("div", { style: `width:${g.step / total * 100}%` })),
      h("p", { class: "help" }, `Step ${g.step + 1} of ${total}`),
      h("p", { class: "big-step" }, name === "keys" ? "Press the highlighted key on your pad" : "Turn the highlighted knob on your pad"),
      g.msg ? h("div", { class: "note warn" }, g.msg) : null,
      h("p", { class: "help" }, "While this runs, the keys and the master knob only report to this page; they don't do their normal job."),
      h("div", { class: "btns" },
        h("button", { class: "btn", onclick: skipStep }, "Skip this one"),
        h("button", { class: "btn", onclick: () => { stopGuided(); arrange = { pick: null }; render(); } }, "Stop")));
    return out;
  }
  if (arrange.done) out.push(h("div", { class: "note" }, "All done. Check the layout, then press Save."));
  const canGuide = S.status.connected && fwOk() && !S.status.standalone;
  out.push(h("div", { class: "section" }, h("h3", {}, "Guided"),
    h("p", {}, "Press each key and turn each knob when it lights up here; the page works out which is which."),
    canGuide ? h("button", { class: "btn primary", onclick: startGuided }, "Start")
      : h("div", { class: "note warn" }, !S.status.connected || S.status.standalone
        ? "Needs the PC app running with the pad connected (python macropad_host.py)."
        : "Needs firmware 1.3 or newer: copy the latest code.py to the CIRCUITPY drive.")));
  out.push(h("div", { class: "section" }, h("h3", {}, "By hand"),
    h("p", {}, "Click two keys (or two knobs) to swap them. The number in the corner of each key is its wiring number: key 1 is GP0."),
    h("div", { class: "btns" },
      h("button", { class: "btn", onclick: () => { pad.layout = clone(S.defaults.layout); render(); } }, "Reset to wiring order"),
      h("button", { class: "btn primary", onclick: () => { arrange = null; render(); } }, "Done"))));
  return out;
}

// ---------------------------------------------------------------------------
// Keyboard: record shortcuts, and select a key by pressing it on the pad
// ---------------------------------------------------------------------------
const CODE_MAP = (() => {
  const m = {};
  for (let c = 65; c <= 90; c++) m["Key" + String.fromCharCode(c)] = String.fromCharCode(c);
  ["ZERO", "ONE", "TWO", "THREE", "FOUR", "FIVE", "SIX", "SEVEN", "EIGHT", "NINE"].forEach((n, i) => {
    m["Digit" + i] = n; m["Numpad" + i] = "KEYPAD_" + n; });
  for (let i = 1; i <= 24; i++) m["F" + i] = "F" + i;
  Object.assign(m, { Enter: "ENTER", Escape: "ESCAPE", Backspace: "BACKSPACE", Tab: "TAB", Space: "SPACEBAR",
    Delete: "DELETE", Insert: "INSERT", ArrowUp: "UP_ARROW", ArrowDown: "DOWN_ARROW", ArrowLeft: "LEFT_ARROW",
    ArrowRight: "RIGHT_ARROW", Home: "HOME", End: "END", PageUp: "PAGE_UP", PageDown: "PAGE_DOWN", Minus: "MINUS",
    Equal: "EQUALS", BracketLeft: "LEFT_BRACKET", BracketRight: "RIGHT_BRACKET", Backslash: "BACKSLASH",
    Semicolon: "SEMICOLON", Quote: "QUOTE", Backquote: "GRAVE_ACCENT", Comma: "COMMA", Period: "PERIOD",
    Slash: "FORWARD_SLASH", PrintScreen: "PRINT_SCREEN", ScrollLock: "SCROLL_LOCK", Pause: "PAUSE",
    CapsLock: "CAPS_LOCK", ContextMenu: "APPLICATION", NumpadAdd: "KEYPAD_PLUS", NumpadSubtract: "KEYPAD_MINUS",
    NumpadMultiply: "KEYPAD_ASTERISK", NumpadDivide: "KEYPAD_FORWARD_SLASH", NumpadEnter: "KEYPAD_ENTER",
    NumpadDecimal: "KEYPAD_PERIOD", NumLock: "KEYPAD_NUMLOCK" });
  return m;
})();
const MEDIA_CODES = { MediaPlayPause: "PLAY_PAUSE", MediaTrackNext: "SCAN_NEXT_TRACK", MediaTrackPrevious: "SCAN_PREVIOUS_TRACK",
  MediaStop: "STOP", AudioVolumeMute: "MUTE", AudioVolumeUp: "VOLUME_INCREMENT", AudioVolumeDown: "VOLUME_DECREMENT" };
function eventKeys(e) {
  const main = CODE_MAP[e.code];
  if (!main) return null;
  const keys = [];
  if (e.ctrlKey) keys.push("CONTROL");
  if (e.shiftKey) keys.push("SHIFT");
  if (e.altKey) keys.push("ALT");
  if (e.metaKey) keys.push("GUI");
  keys.push(main);
  return keys;
}
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const canon = k => ({ LEFT_CONTROL: "CONTROL", RIGHT_CONTROL: "CONTROL", LEFT_SHIFT: "SHIFT", RIGHT_SHIFT: "SHIFT",
  LEFT_ALT: "ALT", RIGHT_ALT: "ALT", LEFT_GUI: "GUI", RIGHT_GUI: "GUI", WINDOWS: "GUI", COMMAND: "GUI" }[k] || k);

document.addEventListener("keydown", e => {
  if (recording) {
    e.preventDefault();
    if (e.code === "Escape") { recording = false; render(); return; }
    const keys = eventKeys(e);
    if (keys && sel.kind === "key") { pad.keys[sel.i] = { type: "keys", keys }; recording = false; render(); }
    else if (keys && sel.kind === "master") { pad.master_push = { type: "keys", keys }; recording = false; render(); }
    return;
  }
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
  const media = MEDIA_CODES[e.code];
  if (media === "VOLUME_INCREMENT" || media === "VOLUME_DECREMENT") { if (sel.kind !== "master") select("master"); return; }
  const keys = media ? null : eventKeys(e);
  const hit = pad.keys.findIndex(a => media ? (a.type === "media" && a.code === media)
    : (keys && a.type === "keys" && sameSet(a.keys.map(canon), keys)));
  if (hit >= 0) { e.preventDefault(); select("key", hit); }
  else if (media && pad.master_push.type === "media" && pad.master_push.code === media) select("master");
});

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
async function start() {
  const r = await fetch("/api/state");
  S = await r.json();
  indexOptions();
  host = clone(S.host); pad = clone(S.pad);
  saved = snapshot();
  drawPills(); render();
  $("#saveBtn").onclick = save;
  $("#revertBtn").onclick = () => { host = JSON.parse(saved).host; pad = JSON.parse(saved).pad; render(); };
  $("#advLink").onclick = () => select("adv");
  $("#arrLink").onclick = () => { recording = false; arrange = { pick: null }; render(); };
  $("#dlLink").onclick = download;
  for (const id of ["arrLink", "advLink", "dlLink"]) $("#" + id).onkeydown = e => { if (e.key === "Enter") $("#" + id).click(); };
  window.addEventListener("beforeunload", e => { if (snapshot() !== saved) { e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("pagehide", () => { if (arrange && arrange.guided) identify(false); });
  poll();
}
start().catch(() => {
  document.body.replaceChildren(h("main", {}, h("section", { class: "card editor" },
    h("h2", {}, "Can't load the settings"), h("p", {}, "Start the PC app (python macropad_host.py) and reload this page."))));
});
</script>
